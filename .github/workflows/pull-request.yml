name: Pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          install: false
          cache: false
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Playwright browsers
        run: pnpm browsers:install --with-deps
      - name: Check
        run: pnpm check
  cli-node-floor:
    name: CLI smoke test on the lowest supported Node.js
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          # The lowest Node.js that packages/cli/package.json engines.node allows.
          # The full suite runs in the check job only, on the current Node.js 24.
          runtime: node@24.11.0
          install: false
          cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Smoke test the CLI bins
        run: pnpm --filter create-project-calavera smoke:node-floor
        env:
          CALAVERA_EXPECTED_NODE: "24.11.0"
  plugins:
    name: Plugins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          install: false
          cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Claude Code checks the marketplace and each plugin. The script allows the
      # install script of the pinned Claude Code package only, because .npmrc
      # turns install scripts off and Claude Code needs one to set up its binary.
      - name: Validate plugins with Claude Code
        run: pnpm plugins:validate
      # The marketplace changes what the skills CLI finds in this repository, so
      # check that it still lists the bundled skills and none of the plugin skills.
      - name: Check skills CLI discovery
        run: pnpm skills:discovery:check

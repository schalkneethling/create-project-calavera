name: Maintain release pull request

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-pr:
    name: Update release pull request
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.changesets.outputs.pr-number }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Create or update release pull request
        id: changesets
        # changesets/action's major version must stay in lockstep with @changesets/cli's
        # major version in package.json (v2 needs CLI v3+). Dependabot bumps these two
        # independently across ecosystems, so verify both together on any major bump.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm release:version
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # The action pushes the release branch with GITHUB_TOKEN, and a pull_request run started by that
  # token waits for manual approval, so the rehearsal cannot rely on the pull_request event. A
  # workflow_dispatch event always creates a run. The rehearsal reports its result on the release
  # pull request's head commit as the "CLI experience rehearsal (pinned)" status (#918), an early
  # signal; the release gate is the same rehearsal in pnpm release:prepare. This job
  # holds actions: write alone, apart from the job that installs dependencies and runs Changesets.
  rehearse-release-pr:
    name: Start the pinned CLI experience rehearsal
    needs: release-pr
    if: needs.release-pr.outputs.pr-number != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Dispatch the rehearsal for the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.release-pr.outputs.pr-number }}
        run: |
          head_ref=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)
          head_sha=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          gh workflow run cli-experience-rehearsal.yml --repo "$GITHUB_REPOSITORY" --ref "$head_ref" \
            -f mode=pinned -f status-sha="$head_sha"

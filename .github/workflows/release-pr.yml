name: Maintain release pull request

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-pr:
    name: Update release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Create or update release pull request
        # changesets/action's major version must stay in lockstep with @changesets/cli's
        # major version in package.json (v2 needs CLI v3+). Dependabot bumps these two
        # independently across ecosystems, so verify both together on any major bump.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm release:version
          github-token: ${{ secrets.GITHUB_TOKEN }}

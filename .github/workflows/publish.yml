name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          install: false
          cache: false
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Playwright browsers
        run: pnpm browsers:install --with-deps
      # The ubuntu-latest image has no zsh, and shell-quote.test.mjs pastes printed commands into
      # zsh and bash (#1037). Hosted Linux runners allow passwordless sudo.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends zsh
      - name: Check
        run: pnpm check
      - name: Validate package
        run: pnpm publish:check
      - name: Install zizmor
        run: python -m pip install --user zizmor==1.25.2
      - name: Check workflows
        run: zizmor --offline .github/workflows

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          install: false
          cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build web composer
        run: pnpm web:build
      - name: Build Baseline Explorer
        run: pnpm --filter @calavera/baseline-explorer build
      - name: Pack package
        env:
          PACKAGE_DIR: ${{ runner.temp }}/package-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$PACKAGE_DIR"
          pnpm --filter create-project-calavera pack --pack-destination "$PACKAGE_DIR"
          pnpm --filter @schalkneethling/calavera-baseline-core pack --pack-destination "$PACKAGE_DIR"
          pnpm --filter @schalkneethling/calavera-artifact-core pack --pack-destination "$PACKAGE_DIR"
          pnpm --filter "./packages/artifacts/*" --recursive pack --pack-destination "$PACKAGE_DIR"
      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package-${{ github.run_id }}-${{ github.run_attempt }}/*.tgz
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      # Only the script that moves `next` (#1126), read from the release commit rather than from the
      # build artifact, so nothing the build job wrote runs while this job can mint OIDC tokens.
      # Non-cone mode checks out that one file and no root files.
      - name: Checkout next tag script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/move-next-tag.mjs
          sparse-checkout-cone-mode: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.8.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted publishing can change a dist-tag only with npm CLI 11.21.0 or later (or 12.2.0 or
      # later on npm 12), and Node.js 24.8.0, which this job pins, bundles npm 11.6.0. See
      # https://docs.npmjs.com/trusted-publishers#managing-dist-tags-with-trusted-publishing
      # The exact version is reviewed here and asserted by check-release-contracts.mjs; npm has
      # no lockfile to install itself from.
      - name: Install npm
        run: | # zizmor: ignore[adhoc-packages]
          npm install --global npm@11.21.2
          test "$(npm --version)" = 11.21.2
      - name: Download package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish package
        env:
          PACKAGE_DIR: ${{ runner.temp }}/package-${{ github.run_id }}-${{ github.run_attempt }}
          NEXT_TAG_SCRIPT: ${{ github.workspace }}/scripts/move-next-tag.mjs
        run: |
          mapfile -t tarballs < <(find "$PACKAGE_DIR" -maxdepth 1 -name "*.tgz" -print)
          if [ "${#tarballs[@]}" -eq 0 ]; then
            echo "No package tarball found in $PACKAGE_DIR."
            exit 1
          fi
          next_tag_failures=()
          for tarball in "${tarballs[@]}"; do
            package_name=$(tar -xOf "$tarball" package/package.json | node -e 'let body=""; process.stdin.on("data", chunk => body += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(body).name))')
            package_version=$(tar -xOf "$tarball" package/package.json | node -e 'let body=""; process.stdin.on("data", chunk => body += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(body).version))')
            view_output=$(mktemp)
            if npm view "${package_name}@${package_version}" version >"$view_output" 2>&1; then
              rm "$view_output"
              echo "Skipping already published ${package_name}@${package_version}."
              publish_state=skipped
            else
              view_status=$?
              if ! grep -Eq '(^|[[:space:]])(E404|404)([[:space:]]|$)' "$view_output"; then
                cat "$view_output" >&2
                rm "$view_output"
                exit "$view_status"
              fi
              rm "$view_output"
              echo "Confirmed ${package_name}@${package_version} is not published."
              dist_tag=latest
              if [[ "$package_version" == *-* ]]; then
                dist_tag=next
              fi
              npm publish "$(realpath "$tarball")" --access public --tag "$dist_tag"
              publish_state=published
            fi
            # A stable release also moves `next` to it, so `next` is never older than `latest`
            # (#993). The script never moves `next` backward or to a prerelease. A skipped version
            # runs it too, so rerunning this job repairs a tag an earlier attempt could not move.
            if ! node "$NEXT_TAG_SCRIPT" "$package_name" "$package_version" "$publish_state"; then
              next_tag_failures+=("${package_name}@${package_version}")
            fi
          done
          if [ "${#next_tag_failures[@]}" -gt 0 ]; then
            echo "Every package is published, but next did not move for: ${next_tag_failures[*]}. The lines above name each cause and remedy." >&2
            exit 1
          fi

name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411 # v2.0.1
        with:
          runtime: node@24
          install: false
          cache: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Playwright browser
        run: pnpm --filter @calavera/baseline-explorer exec playwright install --with-deps chromium
      - name: Check
        run: pnpm check
      - name: Validate package
        run: pnpm publish:check
      - name: Install zizmor
        run: python -m pip install --user zizmor==1.25.2
      - name: Check workflows
        run: zizmor --offline .github/workflows

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411 # v2.0.1
        with:
          runtime: node@24
          install: false
          cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build web composer
        run: pnpm web:build
      - name: Build Baseline Explorer
        run: pnpm --filter @calavera/baseline-explorer build
      - name: Pack package
        env:
          PACKAGE_DIR: ${{ runner.temp }}/package-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$PACKAGE_DIR"
          pnpm --filter create-project-calavera pack --pack-destination "$PACKAGE_DIR"
          pnpm --filter @schalkneethling/calavera-baseline-core pack --pack-destination "$PACKAGE_DIR"
          pnpm --filter @schalkneethling/calavera-artifact-core pack --pack-destination "$PACKAGE_DIR"
          pnpm --filter "./packages/artifacts/*" --recursive pack --pack-destination "$PACKAGE_DIR"
      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package
          path: ${{ runner.temp }}/package-${{ github.run_id }}-${{ github.run_attempt }}/*.tgz
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.8.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: package
          path: ${{ runner.temp }}/package-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish package
        env:
          PACKAGE_DIR: ${{ runner.temp }}/package-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mapfile -t tarballs < <(find "$PACKAGE_DIR" -maxdepth 1 -name "*.tgz" -print)
          if [ "${#tarballs[@]}" -eq 0 ]; then
            echo "No package tarball found in $PACKAGE_DIR."
            exit 1
          fi
          for tarball in "${tarballs[@]}"; do
            package_name=$(tar -xOf "$tarball" package/package.json | node -e 'let body=""; process.stdin.on("data", chunk => body += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(body).name))')
            package_version=$(tar -xOf "$tarball" package/package.json | node -e 'let body=""; process.stdin.on("data", chunk => body += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(body).version))')
            view_output=$(mktemp)
            if npm view "${package_name}@${package_version}" version >"$view_output" 2>&1; then
              rm "$view_output"
              echo "Skipping already published ${package_name}@${package_version}."
              continue
            else
              view_status=$?
              if ! grep -Eq '(^|[[:space:]])(E404|404)([[:space:]]|$)' "$view_output"; then
                cat "$view_output" >&2
                rm "$view_output"
                exit "$view_status"
              fi
              rm "$view_output"
              echo "Confirmed ${package_name}@${package_version} is not published."
            fi
            dist_tag=latest
            if [[ "$package_version" == *-* ]]; then
              dist_tag=next
            fi
            npm publish "$(realpath "$tarball")" --access public --tag "$dist_tag"
          done

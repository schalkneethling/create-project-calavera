version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
      include:
        - "*"
    # Bumped by .github/workflows/baseline-data-refresh.yml, which also
    # regenerates packages/baseline-core/data/baseline.json, the snapshot
    # cutoff, and the Changeset in the same pull request. A Dependabot bump
    # moves the pin on its own and leaves the generated data behind.
    ignore:
      - dependency-name: "baseline-browser-mapping"
      - dependency-name: "web-features"
    # Tauri releases @tauri-apps/cli, @tauri-apps/api, and its plugins in
    # lockstep. Separate pull requests each add the same lockfile entries, and
    # the rebase of the second one duplicates the key, which pnpm rejects
    # (#565). One pull request per Tauri release resolves the lockfile once.
    groups:
      tauri:
        patterns:
          - "@tauri-apps/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      include:
        - "*"
